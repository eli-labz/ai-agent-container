name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.dev.yml config -q
          docker compose --env-file .env.example -f docker-compose-traefik.yml config -q
          docker compose --env-file .env.example -f docker-compose-authentik.yml config -q

  image:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web.Dockerfile
          push: true
          tags: |
            ghcr.io/eli-labz/ai-agent-container:latest
            ghcr.io/eli-labz/ai-agent-container:develop
