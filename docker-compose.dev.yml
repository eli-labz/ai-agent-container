services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: ghcr.io/eli-labz/ai-agent-container:develop
    container_name: ai-agent-container-web-dev
    restart: unless-stopped
    volumes:
      - .:/flowcase
      - flowcase-data:/flowcase/data
      - flowcase-nginx-data:/flowcase/nginx
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
      - AI_AGENT_CONTAINER_ENV=development
      - AI_AGENT_CONTAINER_PORT=5000
    ports:
      - "5000"
    networks:
      - default_network
    command: python run.py --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.28-alpine
    container_name: flowcase-nginx
    restart: unless-stopped
    volumes:
      - flowcase-nginx-data:/etc/nginx/conf.d
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - default_network

networks:
  default_network:
    driver: bridge

volumes:
  flowcase-data:
    external: false
  flowcase-nginx-data:
    external: false